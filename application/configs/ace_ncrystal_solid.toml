# Graphite via NCrystal and NJOY. Relative file paths start at this TOML directory.
# Use ncmat_file instead of ncrystal_builtin to select a local material file.

[workflow]
backend = "ncrystal"

[material]
base_endf_file = "../../tests/fixtures/n_6-C-012g.jeff"
ncrystal_builtin = "C_sg194_pyrolytic_graphite.ncmat"
atom_label = "C"
elastic_mode = "mixed"
temperature_k = 293.6

[output]
directory = "../../tara_output/ace_ncrystal/cli_solid"

[ensemble]
n_samples = 3
include_reference = true
random_seed = 20261008
batch_size = 512

[execution]
n_jobs = 1
njoy_executable = "njoy"

[sampling]
max_energy_shift_mev = 1.0
max_amplitude_shift_pct = 5.0
grid_partition_method = "automatic"
automatic_partition_prominence_pct = 1.0  # Lower values detect more valleys; automatic only.
manual_energy_ranges = []
domain_splitting_strategy = "fixed"
correlation_strategy = "independent"
variable_coupling = "independent"
shared_grid_structure = true
freeze_origin = true
fast_amplitude = true
amplitude_method = "fast"
spatial_method = "diffeomorphic"
auto_normalize = true

[ace]
max_energy_ev = 5.0
suffix = ".01"
nbin = 16
tolerance = 0.001
save_xsdir = true
