name: TARA tests

on:
  pull_request:

permissions:
  contents: read

jobs:
  pytest:
    name: pytest (Ubuntu, Python 3.13)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install TARA and test dependencies
        run: python -m pip install ".[test]"

      - name: Run tests
        run: python -m pytest -ra