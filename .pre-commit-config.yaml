repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: check-ast
      - id: check-json
      - id: check-toml
      - id: check-yaml
      - id: check-merge-conflict
        args: [--assume-in-merge]

  - repo: https://github.com/kynan/nbstripout
    rev: "0.9.2"
    hooks:
      - id: nbstripout
        args: ["--extra-keys=metadata.language_info.version"]
